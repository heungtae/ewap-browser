<dialog
  id="provider-model-selection-dialog"
  aria-labelledby="provider-model-selection-title"
>
  <h2 id="provider-model-selection-title">불러온 모델 선택</h2>
  <p>사용할 모델을 선택한 뒤 저장하세요.</p>
  <label
    >Model
    <select id="provider-model-selection">
      <option value="" selected disabled>모델을 선택하세요</option>
    </select>
  </label>
  <div class="button-row">
    <button id="provider-model-selection-cancel" type="button">취소</button>
    <button id="provider-model-selection-confirm" type="button" disabled>
      선택 저장
    </button>
  </div>
</dialog>
