<section
  class="settings-card"
  id="primary-editor"
  aria-labelledby="primary-title"
>
  <h2 id="primary-title" tabindex="-1">LLM Provider</h2>
  <p>
    질문에 답하고 작업을 처리할 모델입니다. 저장 후 위 관리 영역에서 기본 LLM
    Provider로 적용하세요.
  </p>
  <form id="provider-form">
    <label
      >연결 방식
      <select name="provider_kind">
        <option value="openai_compatible">OpenAI 호환</option>
      </select>
    </label>
    <label
      >Provider 이름 (ID)
      <input
        name="provider_id"
        required
        value="local"
        pattern="[A-Za-z0-9][A-Za-z0-9._-]{0,63}"
        title="영문·숫자로 시작하는 1~64자의 영문, 숫자, 점, 밑줄, 하이픈"
    /></label>
    <label class="checkbox-row"
      ><input name="enabled" type="checkbox" checked />이 Provider 사용</label
    >
    <label
      >API 주소 (Endpoint)
      <input
        name="base_url"
        type="url"
        required
        placeholder="https://provider.example/v1"
    /></label>
    <label
      >모델 이름
      <input name="model" list="provider-models" required value="qwen" />
      <datalist id="provider-models"></datalist>
    </label>
    <button id="provider-models-load" type="button">모델 불러오기</button>
    <label
      >인증 방식
      <select name="api_key_header">
        <option value="none">없음</option>
        <option value="authorization_bearer">Authorization Bearer</option>
        <option value="api-key">api-key</option>
        <option value="x-goog-api-key">x-goog-api-key</option>
      </select></label
    >
    <label
      >API key
      <span class="secret-field">
        <input
          id="provider-api-key"
          name="api_key"
          type="password"
          autocomplete="off"
        />
        <button
          id="api-key-toggle"
          type="button"
          aria-controls="provider-api-key"
          aria-pressed="false"
        >
          표시
        </button>
      </span>
      <span id="api-key-state" class="field-help"
        >새 API key만 입력하세요.</span
      >
    </label>
    <details class="advanced-settings">
      <summary>고급 연결 설정</summary>
      <div class="settings-fields">
        <label
          >API 통신 형식
          <select name="wire_api">
            <option value="auto">자동</option>
            <option value="chat_completions">Chat Completions</option>
            <option value="responses">Responses</option>
          </select>
        </label>
        <p>
          API 통신 형식은 서비스 안내에 맞게 선택하세요. 자동은 Ollama에서 Chat
          Completions, 그 외에는 Responses를 사용합니다.
        </p>
        <div class="headers-field">
          <div class="headers-heading">
            <label for="provider-headers">추가 HTTP 헤더</label>
          </div>
          <div
            id="provider-headers"
            aria-label="HTTP header key-value 목록"
          ></div>
          <p>
            저장된 헤더의 값은 비워두면 유지됩니다. 삭제 후 저장하면 해당 헤더가
            제거됩니다.
          </p>
          <button id="add-header" type="button">+ Header 추가</button>
        </div>
        <label class="checkbox-row"
          ><input name="private_network_opt_in" type="checkbox" />사설
          네트워크의 API 주소 허용</label
        >
        <button id="provider-host-access" type="button">
          HTTP 주소의 Chrome 접근 권한 허용
        </button>
      </div>
    </details>
    <p>
      연결 테스트와 모델 불러오기는 현재 입력한 설정을 먼저 저장합니다.
      내보내기는 저장된 설정에서 API key와 헤더 값을 제외합니다.
    </p>
    <div class="button-row">
      <button type="submit">Provider 저장</button>
      <button id="provider-test" type="button">연결 테스트</button>
      <button
        id="provider-export"
        type="button"
        title="API key와 header 값은 제외됩니다."
      >
        Provider 내보내기
      </button>
      <button id="provider-remove-delete" class="danger-button" type="button">
        Provider 삭제
      </button>
    </div>
    <label class="checkbox-row"
      ><input id="provider-test-messages" type="checkbox" />연결 테스트의
      요청·응답 상세 보기</label
    >
    <pre id="provider-test-diagnostics" hidden></pre>
  </form>
  <output id="settings-status" aria-live="polite"></output>
</section>
